server {
    listen 8080;
    server_tokens off;
    client_max_body_size 1m;

    # Docker DNS observes container replacements without a gateway restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $workspace_frontend frontend:3000;
    set $workspace_api api:8300;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 45s;

    location ^~ /api/v2/ {
        proxy_buffering off;
        proxy_pass http://$workspace_api;
    }

    location = /health {
        proxy_pass http://$workspace_api;
    }

    location /api/ {
        return 404;
    }

    location / {
        proxy_pass http://$workspace_frontend;
    }
}
