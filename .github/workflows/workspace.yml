name: Verify evidence workspace
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/workspace/package-lock.json
      - run: npm ci --prefix apps/workspace
      - run: npm --prefix apps/workspace run typecheck
      - run: npm --prefix apps/workspace test
      - run: npm --prefix apps/workspace run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  api-and-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            gpu-worker/requirements-dev.txt
      - run: python -m pip install -r backend/requirements.txt -r gpu-worker/requirements-dev.txt
      - run: PYTHONPATH=backend python -m pytest -q backend/tests
      - run: PYTHONPATH=. python -m pytest -q
        working-directory: gpu-worker

  container-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      API_ACCESS_TOKEN: workspace-ci-fixture-placeholder
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - run: docker compose -p aegispr-v3-ci -f deploy/web/compose.yml up -d --build
      - run: curl -fsS --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:18203/health
      - run: bash deploy/web/smoke.sh http://127.0.0.1:18203
      - name: Stop test containers
        if: always()
        run: docker compose -p aegispr-v3-ci -f deploy/web/compose.yml down --volumes
